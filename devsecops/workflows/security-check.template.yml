# Gabarit inactif. A raccorder au moteur du membre 2 avant de copier dans .github/workflows.
name: Controle de securite Power BI reel

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    # Adapter si le moteur exige Windows, XMLA ou un runner particulier.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le moteur
        run: python -m pip install -r security_testing/requirements.txt
      - name: Executer le moteur sous une identite de test controlee
        id: engine
        # Le moteur doit ecrire des resultats meme en cas de violation.
        # Utiliser ici les variables/secrets effectivement requis par son adaptateur.
        # Remplacer les deux lignes suivantes par la commande STABLE fournie par le membre 2.
        run: |
          echo "A raccorder: executer le moteur et produire devsecops/reports/real-results.json"
          exit 2
      - name: Generer le rapport et refuser les violations
        if: always() && steps.engine.outcome != 'skipped'
        run: python devsecops/reporting/generate_report.py --input devsecops/reports/real-results.json --output devsecops/reports/real-security.md
      - name: Conserver les preuves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-security-results
          path: devsecops/reports/
          if-no-files-found: warn
